<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mi primera página Hola Mundo publicada automáticamente con GitHub Pages.">
  <title>Hola Mundo | Danny Peña Adames</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 30% 20%, #203763 0%, transparent 45%), linear-gradient(135deg, #090f23, #10192e);
      color: #f5f7ff;
    }
    main { text-align: center; max-width: 740px; padding: 48px 24px; }
    .etiqueta {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid #6f84b2;
      border-radius: 999px;
      font-weight: 650;
      font-size: 13px;
      letter-spacing: .06em;
      color: #bdd6ff;
    }
    h1 { font-size: clamp(56px, 11vw, 110px); letter-spacing: -.07em; line-height: 1.08; margin: 28px 0 20px; }
    h1 span { color: #75e6ce; }
    p { font-size: clamp(17px, 2.5vw, 21px); line-height: 1.6; color: #c5cee1; }
    .estado { margin: 30px auto; padding: 16px 22px; border: 1px solid #3a5f66; background: #173d3e66; border-radius: 14px; color: #b4fff0; }
    footer { margin-top: 46px; color: #9caaca; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="etiqueta">ITLA · PRÁCTICA DE DESPLIEGUE WEB</div>
    <h1>¡Hola, <span>Mundo!</span> 👋</h1>
    <p>Mi primera página web publicada con <strong>GitHub Pages</strong>.</p>
    <div class="estado">✓ Cada cambio enviado a la rama <strong>main</strong> se publicará automáticamente.</div>
    <footer>Desarrollado por Danny Peña Adames · Matrícula 2025-1124</footer>
  </main>
</body>
</html>
